<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b2be0">
<title>টপার হান্ট</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0ff;--card:#fff;--tx:#1c1a2e;--mu:#6d6a85;--pr:#5b2be0;--ac:#ffb020;--me:#e4dbff;--bd:#e3def5}
@media(prefers-color-scheme:dark){:root{--bg:#13111f;--card:#1e1b30;--tx:#f0edfb;--mu:#a5a2bd;--me:#3a2a7a;--bd:#322e4d}}
*{box-sizing:border-box;margin:0;font-family:'Hind Siliguri',sans-serif}
body{background:var(--bg);color:var(--tx);height:100dvh;overflow:hidden}
#app{height:100%;max-width:760px;margin:auto;display:flex;flex-direction:column}
.wrap{padding:24px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.logo{font-size:42px;font-weight:700;color:var(--pr);line-height:1}.logo b{color:var(--ac)}
.sub{color:var(--mu)}
input,select{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
input:focus{outline:2px solid var(--pr)}
button{border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:600;background:var(--pr);color:#fff;cursor:pointer}
button.alt{background:var(--card);color:var(--tx);border:1.5px solid var(--bd)}
button.sm{padding:7px 12px;font-size:14px;border-radius:10px}.red{background:#d63a4a!important;color:#fff!important}
.row{display:flex;gap:8px}.row>*{flex:1}
.head{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--pr);color:#fff;padding-top:max(10px,env(safe-area-inset-top))}
.head h1{font-size:17px;flex:1;line-height:1.2;min-width:0}.head small{display:block;font-weight:400;opacity:.85;font-size:13px}
.head button{background:rgba(255,255,255,.2);padding:8px 10px;font-size:15px;border-radius:12px}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{display:flex;gap:8px;max-width:88%}.m.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#000;display:grid;place-items:center;font-weight:700;object-fit:cover;flex:none}
.av.big{width:96px;height:96px;font-size:36px;margin:auto}
.bub{background:var(--card);padding:8px 12px;border-radius:16px;border-top-left-radius:4px;border:1px solid var(--bd);min-width:0}
.me .bub{background:var(--me);border-radius:16px;border-top-right-radius:4px}
.nm{font-size:13px;font-weight:700;color:var(--pr)}.tm{font-size:11px;color:var(--mu);margin-top:2px}
.bub p{white-space:pre-wrap;word-break:break-word}
.bub img,.bub video{max-width:100%;border-radius:10px;margin-top:4px;display:block}.bub audio{max-width:100%;margin-top:4px}
.x{background:none;color:var(--mu);padding:0 4px;font-size:12px}
.comp{display:flex;gap:6px;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--bd)}
.comp input{border-radius:22px}.comp button{border-radius:22px;padding:10px 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px}
.card>div{flex:1;min-width:0}
.list{padding:14px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(160deg,#5b2be0,#2a1370);color:#fff;text-align:center}.splash .logo{color:#fff;font-size:48px}.splash .sub{color:#ffd37a}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;background:var(--me)}
</style></head>
<body><div id="app"><div class="splash" data-splash><div style="font-size:64px">💬</div><div class="logo">টপার <b>হান্ট</b></div><div class="sub">লোড হচ্ছে…</div></div></div>
<script>
const showE=m=>{const a=document.getElementById('app');if(a&&a.querySelector('[data-splash]'))a.innerHTML='<div class="wrap"><div class="logo">ত্রুটি</div><div class="sub" style="word-break:break-word">'+String(m).replace(/</g,'&lt;')+'</div><button onclick="location.reload()">আবার চেষ্টা করুন</button></div>'};
addEventListener('error',e=>showE(e.message||'অজানা ত্রুটি'));
addEventListener('unhandledrejection',e=>showE((e.reason&&(e.reason.code||e.reason.message))||e.reason));
setTimeout(()=>showE('৮ সেকেন্ডেও লোড হয়নি। ইন্টারনেট দেখুন এবং ফাইলটি সরাসরি না খুলে ওয়েব লিংক (https) দিয়ে খুলুন।'),8000);
</script>
<script>
function startApp(){
/* ---- Firebase compat shim: সাধারণ (non-module) স্ক্রিপ্টে চলার জন্য ---- */
const initializeApp=c=>firebase.initializeApp(c);
const getAuth=()=>firebase.auth(),getFirestore=()=>firebase.firestore(),getDatabase=()=>firebase.database();
const GoogleAuthProvider=firebase.auth.GoogleAuthProvider;
const onAuthStateChanged=(a,cb,er)=>a.onAuthStateChanged(cb,er);
const signInWithPopup=(a,p)=>a.signInWithPopup(p);
const signInWithEmailAndPassword=(a,e,p)=>a.signInWithEmailAndPassword(e,p);
const createUserWithEmailAndPassword=(a,e,p)=>a.createUserWithEmailAndPassword(e,p);
const sendPasswordResetEmail=(a,e)=>a.sendPasswordResetEmail(e);
const signOut=a=>a.signOut();
function RecaptchaVerifier(a,id,o){return new firebase.auth.RecaptchaVerifier(id,o)}
const signInWithPhoneNumber=(a,n,v)=>a.signInWithPhoneNumber(n,v);
const wrapS=s=>typeof s.exists==="boolean"?{exists:()=>s.exists,data:()=>s.data(),id:s.id,ref:s.ref}:s;
const doc=(d,...p)=>d.doc(p.join("/")),collection=(d,...p)=>d.collection(p.join("/"));
const getDoc=async r=>wrapS(await r.get());
const setDoc=(r,d)=>r.set(d),updateDoc=(r,d)=>r.update(d),deleteDoc=r=>r.delete(),addDoc=(c,d)=>c.add(d);
const query=(q,...cs)=>cs.reduce((a,f)=>f(a),q),orderBy=(f,d)=>q=>q.orderBy(f,d),limit=n=>q=>q.limit(n);
const onSnapshot=(r,cb,er)=>r.onSnapshot(s=>cb(wrapS(s)),er);
const serverTimestamp=()=>firebase.firestore.FieldValue.serverTimestamp();
const arrayUnion=(...v)=>firebase.firestore.FieldValue.arrayUnion(...v);
const rts=()=>firebase.database.ServerValue.TIMESTAMP;
const dref=(d,p)=>d.ref(p),set=(r,v)=>r.set(v),onDisconnect=r=>r.onDisconnect();
const onValue=(r,cb)=>{r.on("value",cb);return()=>r.off("value",cb)};
/* ---- শেষ ---- */


const ADMIN_EMAIL="susantakumar0911@gmail.com";      // <-- আপনার Gmail (rules-এও একই দিন)
const CLOUD="YOUR_CLOUD_NAME";            // <-- Cloudinary cloud name
const PRESET="YOUR_UNSIGNED_PRESET";      // <-- Cloudinary unsigned upload preset
const PIN_HASH="073b08ac596463afb2721bab05c34fb406c82633fcc8e7bf37909c59f69f6088"; // অ্যাডমিন প্যানেল লক (আসল সুরক্ষা Gmail + rules)
const GROUP="Royal Government High School – টপার হান্ট – ক্লাস ৮";
const cfg={apiKey:"AIzaSyB3Dfyc_Z7VFhXnMaDvzCgoCgtITQwGlSQ",authDomain:"topper-hunt.firebaseapp.com",databaseURL:"https://topper-hunt-default-rtdb.firebaseio.com",projectId:"topper-hunt",storageBucket:"topper-hunt.firebasestorage.app",messagingSenderId:"289594818315",appId:"1:289594818315:web:b86115abac0cce11042c0e"};
const fb=initializeApp(cfg),auth=getAuth(fb),db=getFirestore(fb),rdb=getDatabase(fb);
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mref=u=>doc(db,"groups","main","members",u);
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const okU=u=>/^https:\/\/res\.cloudinary\.com\//.test(u||"");
const yid=u=>((u||"").match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/)||[])[1];
const av=(p,n,c="av")=>p?`<img class="${c}" src="${esc(p)}" alt="" referrerpolicy="no-referrer">`:`<div class="${c}">${esc((n||"?")[0])}</div>`;
const fmt=t=>t?t.toDate().toLocaleString("bn-BD",{hour:"numeric",minute:"2-digit",day:"numeric",month:"short"}):"";
const err=e=>alert("ত্রুটি: "+(e.code||e.message));
const shrink=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=96;const s=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,96,96);ok(c.toDataURL("image/jpeg",.7))};i.onerror=no;i.src=URL.createObjectURL(f)});
const up=async f=>{if(CLOUD.startsWith("YOUR"))throw{message:"ছবি/ভিডিও/ভয়েস এখনো চালু করা হয়নি (Cloudinary সেটআপ বাকি)। চ্যাট ও বাকি সব ঠিকঠাক চলবে।"};if(f.size>25*1024*1024)throw{message:"ফাইল ২৫ MB-এর বেশি হতে পারবে না"};const d=new FormData();d.append("file",f,f.name||"voice.webm");d.append("upload_preset",PRESET);
  const j=await(await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/auto/upload`,{method:"POST",body:d})).json();
  if(!j.secure_url)throw{message:(j.error&&j.error.message)||"আপলোড ব্যর্থ"};return j.secure_url};
let U,P,M,subs=[];const PH={};
const clear=()=>{subs.forEach(f=>f());subs=[]};
const isAdmin=()=>U&&U.email===ADMIN_EMAIL&&U.emailVerified;

const fail=e=>{app.innerHTML=`<div class="wrap"><div class="logo">সমস্যা হয়েছে</div><div class="sub" style="word-break:break-word">${esc(e.code||e.message)}<br>Firestore Database তৈরি এবং Rules Publish করা হয়েছে কিনা দেখুন।</div><button id="rl">আবার চেষ্টা</button><button class="alt" id="lo">লগআউট</button></div>`;$("#rl").onclick=()=>location.reload();$("#lo").onclick=()=>signOut(auth).then(()=>location.reload())};
onAuthStateChanged(auth,u=>boot(u).catch(fail),fail);
async function boot(u){
  clear();U=u;
  if(!u)return loginView();
  const s=await getDoc(doc(db,"users",u.uid));
  if(!s.exists())return regView();
  P=s.data();
  if(isAdmin()){const m=await getDoc(mref(u.uid));if(!m.exists())await setDoc(mref(u.uid),{status:"approved",role:"admin",name:P.name,photo:P.photo||"",roll:P.roll,requestedAt:serverTimestamp()})}
  subs.push(onSnapshot(mref(u.uid),m=>{M=m.exists()?m.data():null;
    if(!M)joinView();else if(M.status==="pending")waitView();else chatView()},fail));
}

function loginView(){app.innerHTML=`<div class="wrap">
<div class="logo">টপার <b>হান্ট</b></div><div class="sub">স্কুলের বন্ধুদের নিজস্ব চ্যাট</div>
<button id="g">Google দিয়ে সাইন ইন</button>
<input id="e" type="email" placeholder="ইমেইল"><input id="p" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)">
<div class="row"><button class="alt" id="li">লগইন</button><button class="alt" id="su">নতুন অ্যাকাউন্ট</button></div>
<input id="ph" type="tel" placeholder="ফোন নম্বর (+8801XXXXXXXXX)"><button class="alt" id="so">ফোনে কোড পাঠান</button><div id="rc"></div>
<input id="cd" inputmode="numeric" placeholder="৬ সংখ্যার কোড" style="display:none"><button id="vc" style="display:none">কোড যাচাই করুন</button>
<button class="alt" id="fp">পাসওয়ার্ড ভুলে গেছেন?</button></div>`;
  $("#g").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(err);
  $("#li").onclick=()=>signInWithEmailAndPassword(auth,$("#e").value.trim(),$("#p").value).catch(err);
  $("#su").onclick=()=>createUserWithEmailAndPassword(auth,$("#e").value.trim(),$("#p").value).catch(err);
  let cf;
  $("#so").onclick=async()=>{try{window.rv=window.rv||new RecaptchaVerifier(auth,"rc",{size:"normal"});
    cf=await signInWithPhoneNumber(auth,$("#ph").value.trim(),window.rv);$("#cd").style.display=$("#vc").style.display="block"}catch(e){err(e)}};
  $("#vc").onclick=()=>cf&&cf.confirm($("#cd").value.trim()).catch(err);
  $("#fp").onclick=()=>sendPasswordResetEmail(auth,$("#e").value.trim()).then(()=>alert("রিসেট লিংক ইমেইলে পাঠানো হয়েছে")).catch(err);
}

function regView(){let ph=U.photoURL||"";
  app.innerHTML=`<div class="wrap"><div class="logo">নিবন্ধন</div><div id="pv">${av(ph,"?","av big")}</div>
<button class="alt" id="pb">📷 প্রোফাইল ছবি দিন (আবশ্যক)</button><input id="pf" type="file" accept="image/*" hidden>
<input id="n" placeholder="পূর্ণ নাম" maxlength="60" value="${esc(U.displayName||"")}"><input id="k" placeholder="ডাকনাম" maxlength="30">
<div class="row"><input id="c" placeholder="শ্রেণি" value="৮"><input id="r" placeholder="রোল" inputmode="numeric"><input id="s" placeholder="শাখা"></div>
<button id="ok">সংরক্ষণ করুন</button><button class="alt" id="lo">লগআউট</button></div>`;
  $("#lo").onclick=()=>signOut(auth);
  $("#pb").onclick=()=>$("#pf").click();
  $("#pf").onchange=async e=>{try{ph=await shrink(e.target.files[0]);$("#pv").innerHTML=av(ph,"?","av big")}catch(x){err(x)}};
  $("#ok").onclick=async()=>{const d={name:$("#n").value.trim(),nick:$("#k").value.trim(),cls:$("#c").value.trim(),roll:$("#r").value.trim(),section:$("#s").value.trim(),photo:ph,bio:"",email:U.email||""};
    if(d.name.length<2||!d.cls||!d.roll||!d.section)return alert("নাম, শ্রেণি, রোল ও শাখা আবশ্যক");
    if(!ph)return alert("প্রোফাইল ছবি আবশ্যক");
    try{await setDoc(doc(db,"users",U.uid),d);location.reload()}catch(e){err(e)}};
}

function joinView(){app.innerHTML=`<div class="wrap"><div class="logo">${esc(P.nick||P.name)}, স্বাগতম!</div>
<div class="sub">${GROUP}<br>গ্রুপে ঢুকতে অ্যাডমিনের অনুমতি লাগবে।</div>
<button id="j">যোগ দেওয়ার অনুরোধ পাঠান</button><button class="alt" id="lo">লগআউট</button></div>`;
  $("#lo").onclick=()=>signOut(auth);
  $("#j").onclick=()=>setDoc(mref(U.uid),{status:"pending",role:"member",name:P.name,photo:P.photo||"",roll:P.roll,requestedAt:serverTimestamp()}).catch(err);
}
function waitView(){app.innerHTML=`<div class="wrap"><div class="logo">অপেক্ষা করুন…</div><div class="sub">আপনার অনুরোধ অ্যাডমিনের কাছে গেছে। অনুমোদন পেলেই এই পেজ নিজে থেকে খুলে যাবে।</div><button class="alt" id="lo">লগআউট</button></div>`;
  $("#lo").onclick=()=>signOut(auth);
}

function chatView(){clear();
  subs.push(onSnapshot(mref(U.uid),m=>{if(!m.exists()||m.data().status!=="approved")location.reload()}));
  app.innerHTML=`<div class="head"><h1>${GROUP}<small>অনলাইন: <span id="on">0</span> জন</small></h1>
  <button id="cv" title="চ্যানেল">🎬</button><button id="pr" title="প্রোফাইল">👤</button><button id="cl" title="কল">📞</button>${isAdmin()?'<button id="ad" title="অ্যাডমিন">⚙️</button>':""}<button id="lo" title="বের হোন">⎋</button></div>
  <div id="msgs"></div>
  <div class="comp"><button class="alt" id="at">📎</button><input id="f" type="file" accept="image/*,video/*" hidden>
  <input id="t" placeholder="মেসেজ লিখুন…" maxlength="2000"><button class="alt" id="mc">🎤</button><button id="sd">➤</button></div>`;
  $("#lo").onclick=()=>signOut(auth);$("#cv").onclick=chView;$("#pr").onclick=profileView;
  if(isAdmin())$("#ad").onclick=async()=>{const p=prompt("অ্যাডমিন পাসওয়ার্ড দিন");if(p===null)return;(await sha(p))===PIN_HASH?adminView():alert("ভুল পাসওয়ার্ড")};
  const pr=dref(rdb,"status/"+U.uid);set(pr,{online:true,t:rts()});onDisconnect(pr).set({online:false,t:rts()});
  subs.push(onValue(dref(rdb,"status"),s=>{let n=0;s.forEach(c=>{if(c.val().online)n++});const o=$("#on");if(o)o.textContent=n}));
  const box=$("#msgs");let L=[];
  const draw=()=>{const down=box.scrollHeight-box.scrollTop-box.clientHeight<120;
    box.innerHTML=L.map(d=>{const m=d.data(),me=m.uid===U.uid,u=esc(okU(m.mediaUrl)?m.mediaUrl:"");
      const media=m.callUrl&&/^https:\/\/meet\.jit\.si\//.test(m.callUrl)?`<a href="${esc(m.callUrl)}" target="_blank" rel="noopener"><button class="sm">📞 কলে যোগ দিন</button></a>`
        :u?(m.mediaType==="video"?`<video controls src="${u}"></video>`:m.mediaType==="audio"?`<audio controls src="${u}"></audio>`:`<img src="${u}" alt="">`):"";
      return `<div class="m ${me?"me":""}">${av(PH[m.uid],m.name)}<div class="bub"><div class="nm">${esc(m.name)}</div>${m.text?`<p>${esc(m.text)}</p>`:""}${media}
      <div class="tm">${fmt(m.createdAt)} ${(me||isAdmin())?`<button class="x" data-d="${d.id}">মুছুন</button>`:""}</div></div></div>`}).join("")||'<div class="sub" style="text-align:center">প্রথম মেসেজটি আপনিই পাঠান 👋</div>';
    if(down)box.scrollTop=box.scrollHeight};
  subs.push(onSnapshot(collection(db,"groups","main","members"),s=>{s.forEach(d=>PH[d.id]=d.data().photo);draw()},err));
  subs.push(onSnapshot(query(collection(db,"groups","main","messages"),orderBy("createdAt","asc"),limit(150)),s=>{L=s.docs;draw()},err));
  box.onclick=e=>{const id=e.target.dataset.d;if(id&&confirm("মেসেজটি মুছবেন?"))deleteDoc(doc(db,"groups","main","messages",id)).catch(err)};
  const send=async(x={})=>{const t=$("#t").value.trim();if(!t&&!x.mediaUrl&&!x.callUrl)return;$("#t").value="";
    try{await addDoc(collection(db,"groups","main","messages"),{uid:U.uid,name:P.nick||P.name,text:t,createdAt:serverTimestamp(),...x})}catch(e){err(e)}};
  $("#sd").onclick=()=>send();$("#t").onkeydown=e=>{if(e.key==="Enter")send()};
  $("#at").onclick=()=>$("#f").click();
  $("#f").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{send({mediaUrl:await up(f),mediaType:f.type.startsWith("video")?"video":"image"})}catch(x){err(x)}e.target.value=""};
  $("#cl").onclick=()=>{if(!confirm("গ্রুপের জন্য নতুন অডিও/ভিডিও কল শুরু করবেন?"))return;const u="https://meet.jit.si/TopperHunt-"+crypto.randomUUID().slice(0,12);send({callUrl:u});window.open(u,"_blank")};
  let rec,ch=[];
  $("#mc").onclick=async()=>{if(rec&&rec.state==="recording")return rec.stop();
    try{const s=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(s);ch=[];
      rec.ondataavailable=e=>ch.push(e.data);
      rec.onstop=async()=>{s.getTracks().forEach(t=>t.stop());$("#mc").textContent="🎤";try{send({mediaUrl:await up(new Blob(ch,{type:rec.mimeType||"audio/webm"})),mediaType:"audio"})}catch(x){err(x)}};
      rec.start();$("#mc").textContent="⏹"}catch(e){err(e)}};
}

function profileView(){clear();let ph=P.photo||"";
  app.innerHTML=`<div class="head"><button id="bk">←</button><h1>আমার প্রোফাইল</h1></div><div class="list">
  <div id="pv">${av(ph,P.name,"av big")}</div><button class="alt" id="pb">📷 ছবি বদলান</button><input id="pf" type="file" accept="image/*" hidden>
  <div class="sub" style="text-align:center">${esc(P.name)} · শ্রেণি ${esc(P.cls)} · রোল ${esc(P.roll)} · শাখা ${esc(P.section)}</div>
  <input id="k" maxlength="30" placeholder="ডাকনাম" value="${esc(P.nick)}"><input id="b" maxlength="150" placeholder="আমার সম্পর্কে" value="${esc(P.bio)}">
  <button id="sv">সংরক্ষণ করুন</button></div>`;
  $("#bk").onclick=chatView;$("#pb").onclick=()=>$("#pf").click();
  $("#pf").onchange=async e=>{try{ph=await shrink(e.target.files[0]);$("#pv").innerHTML=av(ph,P.name,"av big")}catch(x){err(x)}};
  $("#sv").onclick=async()=>{try{const d={nick:$("#k").value.trim(),bio:$("#b").value.trim(),photo:ph};
    await updateDoc(doc(db,"users",U.uid),d);await updateDoc(mref(U.uid),{photo:ph});P={...P,...d};alert("সংরক্ষিত হয়েছে");chatView()}catch(e){err(e)}};
}

function chView(){clear();
  app.innerHTML=`<div class="head"><button id="bk">←</button><h1>চ্যানেল</h1><button id="nc">+ নতুন</button></div><div class="list" id="ls"></div>`;
  $("#bk").onclick=chatView;
  $("#nc").onclick=()=>{const n=(prompt("চ্যানেলের নাম?")||"").trim();if(n.length>1)addDoc(collection(db,"channels"),{name:n.slice(0,40),owner:U.uid,ownerName:P.nick||P.name,createdAt:serverTimestamp()}).catch(err)};
  subs.push(onSnapshot(query(collection(db,"channels"),orderBy("createdAt","desc")),s=>{
    $("#ls").innerHTML=s.docs.map(d=>`<div class="card" data-c="${d.id}" style="cursor:pointer"><div class="av">🎬</div><div><b>${esc(d.data().name)}</b><br><span class="sub">${esc(d.data().ownerName)}</span></div></div>`).join("")||'<div class="sub">এখনো কোনো চ্যানেল নেই। "+ নতুন" চেপে তৈরি করুন।</div>'},err));
  $("#ls").onclick=e=>{const c=e.target.closest("[data-c]");if(c)chDetail(c.dataset.c)};
}

async function chDetail(id){clear();
  const c=(await getDoc(doc(db,"channels",id))).data(),mine=c.owner===U.uid||isAdmin(),vc=collection(db,"channels",id,"videos"),open=new Set();let L=[];
  app.innerHTML=`<div class="head"><button id="bk">←</button><h1>${esc(c.name)}<small>${esc(c.ownerName)}</small></h1></div><div class="list">
  ${mine?'<div class="row"><button id="uv">⬆ ভিডিও আপলোড</button><button class="alt" id="yl">YouTube লিংক</button></div><input id="vf" type="file" accept="video/*" hidden>':""}<div id="vs" style="display:flex;flex-direction:column;gap:10px"></div></div>`;
  $("#bk").onclick=chView;
  const add=(t,url,type)=>addDoc(vc,{title:t.slice(0,80),url,type,owner:U.uid,viewedBy:[],createdAt:serverTimestamp()}).catch(err);
  if(mine){$("#uv").onclick=()=>$("#vf").click();
    $("#vf").onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=prompt("ভিডিওর শিরোনাম?",f.name);if(!t)return;
      try{alert("আপলোড চলছে, একটু অপেক্ষা করুন…");add(t,await up(f),"file")}catch(x){err(x)}e.target.value=""};
    $("#yl").onclick=()=>{const u=prompt("YouTube লিংক দিন");if(!u)return;if(!yid(u))return alert("সঠিক YouTube লিংক নয়");const t=prompt("শিরোনাম?");if(t)add(t,u,"yt")}}
  const draw=()=>{$("#vs").innerHTML=L.map(d=>{const v=d.data(),n=(v.viewedBy||[]).length;
    const pl=open.has(d.id)?(v.type==="yt"&&yid(v.url)?`<iframe src="https://www.youtube-nocookie.com/embed/${yid(v.url)}" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px"></iframe>`:okU(v.url)?`<video controls autoplay src="${esc(v.url)}" style="width:100%;border-radius:12px"></video>`:""):`<button data-v="${d.id}">▶ দেখুন</button>`;
    return `<div class="card" style="flex-direction:column;align-items:stretch"><b>${esc(v.title)}</b>${pl}<span class="sub">${n} বার দেখা হয়েছে ${mine?`<button class="x" data-x="${d.id}">মুছুন</button>`:""}</span></div>`}).join("")||'<div class="sub">এখনো কোনো ভিডিও নেই</div>'};
  subs.push(onSnapshot(query(vc,orderBy("createdAt","desc")),s=>{L=s.docs;draw()},err));
  $("#vs").onclick=e=>{const v=e.target.dataset.v,x=e.target.dataset.x;
    if(v){open.add(v);draw();const d=L.find(z=>z.id===v);if(d&&!(d.data().viewedBy||[]).includes(U.uid))updateDoc(d.ref,{viewedBy:arrayUnion(U.uid)}).catch(()=>{})}
    if(x&&confirm("ভিডিওটি মুছবেন?"))deleteDoc(doc(db,"channels",id,"videos",x)).catch(err)};
}

function adminView(){clear();
  app.innerHTML=`<div class="head"><button id="bk">←</button><h1>অ্যাডমিন প্যানেল</h1></div><div class="list" id="ls"></div>`;
  $("#bk").onclick=chatView;
  subs.push(onSnapshot(collection(db,"groups","main","members"),s=>{
    const arr=s.docs.sort((a,b)=>(a.data().status==="pending"?0:1)-(b.data().status==="pending"?0:1));
    $("#ls").innerHTML=arr.map(d=>{const m=d.data(),p=m.status==="pending";
      return `<div class="card">${av(m.photo,m.name)}<div><b>${esc(m.name)}</b> <span class="tag">${p?"অপেক্ষমাণ":m.role==="admin"?"অ্যাডমিন":"সদস্য"}</span><br><small>রোল: ${esc(m.roll)}</small></div>
      ${p?`<button class="sm" data-a="${d.id}">অনুমোদন</button><button class="sm red" data-r="${d.id}">বাতিল</button>`:m.role==="admin"?"":`<button class="sm red" data-r="${d.id}">সরান</button>`}</div>`}).join("")}));
  $("#ls").onclick=e=>{const a=e.target.dataset.a,r=e.target.dataset.r;
    if(a)updateDoc(mref(a),{status:"approved"}).catch(err);
    if(r&&confirm("নিশ্চিত?"))deleteDoc(mref(r)).catch(err)};
}
}
</script>
<script>
(function(){
const sets=[["https://www.gstatic.com/firebasejs/10.14.1/",".js"],["https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/",".min.js"]];
const parts=["app","auth","firestore","database"];
const load=u=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=()=>no(new Error(u));document.head.appendChild(s)});
(async()=>{
  for(const [b,e] of sets){try{for(const p of parts)await load(b+"firebase-"+p+"-compat"+e);return startApp()}catch(x){}}
  showE("Firebase লোড হয়নি। আপনার বিল্ডার (Hope Web) বাইরের স্ক্রিপ্ট আটকে দিচ্ছে। ফাইলটি Cloudflare Pages-এ আপলোড করে লিংক দিয়ে খুলুন।");
})();
})();
</script></body></html>
