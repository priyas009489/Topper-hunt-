<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b2be0">
<title>টপার হান্ট</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0ff;--card:#fff;--tx:#1c1a2e;--mu:#6d6a85;--pr:#5b2be0;--ac:#ffb020;--me:#e4dbff;--bd:#e3def5}
@media(prefers-color-scheme:dark){:root{--bg:#13111f;--card:#1e1b30;--tx:#f0edfb;--mu:#a5a2bd;--me:#3a2a7a;--bd:#322e4d}}
*{box-sizing:border-box;margin:0;font-family:'Hind Siliguri',sans-serif}
body{background:var(--bg);color:var(--tx);height:100dvh;overflow:hidden}
#app{height:100%;max-width:760px;margin:auto;display:flex;flex-direction:column}
.wrap{padding:24px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.logo{font-size:42px;font-weight:700;color:var(--pr);line-height:1}.logo b{color:var(--ac)}
.sub{color:var(--mu)}
input,select{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
input:focus{outline:2px solid var(--pr)}
button{border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:600;background:var(--pr);color:#fff;cursor:pointer}
button.alt{background:var(--card);color:var(--tx);border:1.5px solid var(--bd)}
button.sm{padding:7px 12px;font-size:14px;border-radius:10px}.red{background:#d63a4a!important;color:#fff!important}
.row{display:flex;gap:8px}.row>*{flex:1}
.head{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--pr);color:#fff;padding-top:max(10px,env(safe-area-inset-top))}
.head h1{font-size:17px;flex:1;line-height:1.2;min-width:0}.head small{display:block;font-weight:400;opacity:.85;font-size:13px}
.head button{background:rgba(255,255,255,.2);padding:8px 10px;font-size:15px;border-radius:12px}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{display:flex;gap:8px;max-width:88%}.m.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#000;display:grid;place-items:center;font-weight:700;object-fit:cover;flex:none}
.av.big{width:96px;height:96px;font-size:36px;margin:auto}
.bub{background:var(--card);padding:8px 12px;border-radius:16px;border-top-left-radius:4px;border:1px solid var(--bd);min-width:0}
.me .bub{background:var(--me);border-radius:16px;border-top-right-radius:4px}
.nm{font-size:13px;font-weight:700;color:var(--pr)}.tm{font-size:11px;color:var(--mu);margin-top:2px}
.bub p{white-space:pre-wrap;word-break:break-word}
.bub img,.bub video{max-width:100%;border-radius:10px;margin-top:4px;display:block}.bub audio{max-width:100%;margin-top:4px}
.x{background:none;color:var(--mu);padding:0 4px;font-size:12px}
.comp{display:flex;gap:6px;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--bd)}
.comp input{border-radius:22px}.comp button{border-radius:22px;padding:10px 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px}
.card>div{flex:1;min-width:0}
